<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official website of the developer of 9.">
  <title>9 — Official Developer Website</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #12151d;
      --text: #f5f7fb;
      --muted: #9da5b4;
      --accent: #6c63ff;
      --border: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(108,99,255,.22), transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: rgba(18,21,29,.88);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 56px 48px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 28px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(135deg, #7c73ff, #5148e8);
      box-shadow: 0 12px 35px rgba(108,99,255,.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 58px);
      letter-spacing: -2px;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 42px 0 30px;
    }

    .support {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
    }

    .support strong {
      color: var(--text);
    }

    footer {
      margin-top: 28px;
      color: #697180;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .card { padding: 42px 24px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="logo">9</div>

      <h1>9</h1>

      <p class="subtitle">
        Official website of the developer.
        Discover our apps and get support whenever you need it.
      </p>

      <div class="divider"></div>

      <div class="support">
        <strong>Support</strong><br>
        If you have questions or need assistance with our application,
        please contact the developer.
      </div>

      <footer>
        © 2026 9 Developer. All rights reserved.
      </footer>
    </section>
  </main>
</body>
</html>
